/* Mark the active section tab: the page itself, else the first breadcrumb below the home page. */
(function () {
  function mark() {
    var here = location.pathname.split('/').pop().replace(/\.html$/, '') || 'index';
    var crumbs = Array.prototype.map.call(document.querySelectorAll('#nav-path li.navelem a'),
      function (a) { return (a.getAttribute('href') || '').split('/').pop().replace(/\.html.*$/, ''); });
    var tabs = document.querySelectorAll('.bl-tabs a');
    var hit = null;
    [here].concat(crumbs.slice(1), crumbs.slice(0, 1)).some(function (name) {
      for (var i = 0; i < tabs.length; ++i) if (tabs[i].dataset.section === name) { hit = tabs[i]; return true; }
      return false;
    });
    if (!hit && /^(class|struct|namespace|group|concept|union|files|annotated|namespaces|concepts|.*_8h)/.test(here))
      hit = document.querySelector('.bl-tabs a[data-section="group__api"]');
    if (hit) hit.classList.add('bl-active');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mark); else mark();
  /* DISABLE_INDEX=YES drops the doxygen-config block that search.js keys its init on. */

      if (a.textContent.indexOf('&#x2F;') >= 0) a.textContent = a.textContent.replace(/&#x2F;/g, '/');

  window.addEventListener('load', function () {
